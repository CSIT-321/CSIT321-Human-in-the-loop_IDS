[project]
name = "hitl-ids"
version = "0.1.0"
description = "Human-in-the-Loop Intrusion Detection dashboard (FYP-26-S3-13)"
requires-python = ">=3.11"
# S2 added only what the contracts and their tests need. S1 (delegated) completes this file:
# fastapi, shap, and the apps/web Vite toolchain.
dependencies = [
    "pydantic>=2.11",
    "numpy",
    "pandas",
    "xgboost",
    "scikit-learn",
    # The demo API (apps/api): `python -m uvicorn apps.api.main:app`, run from this folder.
    # Tested on FastAPI 0.136 (Starlette 0.48). Older FastAPI with Starlette 1.x fails at import with
    # "Router.__init__() got an unexpected keyword argument 'on_startup'".
    "fastapi>=0.136",
    "uvicorn>=0.37",
    # S18a real sign-in: bcrypt hashes the seeded demo passwords, PyJWT mints the bearer tokens.
    "bcrypt",
    "pyjwt>=2.10",
]

# Only these two folders are importable code; data/, models/, rules/, notebooks/ and the rest are not.
# Without this, `pip install -e .` stops with "Multiple top-level packages discovered in a flat-layout".
[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[project.optional-dependencies]
# httpx backs FastAPI's TestClient in tests/test_api*.py.
dev = ["pytest>=8", "ruff", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
