<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        const key = "hitl-ids-theme";
        let saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch {
          // The app still follows the system preference when storage is unavailable.
        }
        const systemDark = typeof matchMedia === "function"
          && matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved === "light" || saved === "dark"
          ? saved
          : systemDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>IDS Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
